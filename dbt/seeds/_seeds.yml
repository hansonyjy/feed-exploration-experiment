version: 2

seeds:
  - name: segment_band_map
    description: >
      D46 merge of tenure (register_days_range) and follow-count (follow_user_num_range) bands, written
      by scripts/make_segment_bands.py from user counts in raw.user_features: groups under 1,000 users
      merge with their smaller adjacent neighbour until every group has at least 1,000.
    config:
      column_types:
        dimension: string
        band: string
        band_order: int64
        n_users: int64
        merged_band: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['dimension', 'band']
    columns:
      - name: dimension
        description: register_days_range or follow_user_num_range.
        data_tests: [not_null]
      - name: band
        description: Band as provided in user_features.
        data_tests: [not_null]
      - name: band_order
        description: Order of the band by its lower bound.
      - name: n_users
        description: Users in the band.
      - name: merged_band
        description: Segment label after the D46 merge.
        data_tests: [not_null]

  - name: frozen_duration_buckets
    description: >
      D26 decile edges from the full-data prod build, exported once by scripts/freeze_reference.py
      from int_duration_buckets_computed (D55). Never regenerated after the prod build.
    config:
      column_types:
        duration_bucket: int64
        lower_exclusive_ms: float64
        upper_inclusive_ms: float64
        n_reference_rows: int64
    columns:
      - name: duration_bucket
        description: Bucket 1 (shortest) to 10 (longest).
        data_tests: [unique, not_null]
      - name: lower_exclusive_ms
        description: Exclusive lower edge in ms; empty for bucket 1.
      - name: upper_inclusive_ms
        description: Inclusive upper edge in ms; empty for bucket 10.
      - name: n_reference_rows
        description: Reference impressions the edges were computed from.

  - name: frozen_reference_thresholds
    description: >
      D25/D29 bucket medians of play_time_ms from the full-data prod build, exported once by
      scripts/freeze_reference.py from int_reference_thresholds_computed (D55).
    config:
      column_types:
        duration_bucket: int64
        median_play_time_ms: int64
        n_reference_rows: int64
    columns:
      - name: duration_bucket
        description: D26 bucket.
        data_tests: [unique, not_null]
      - name: median_play_time_ms
        description: Effective-view threshold for the bucket, in ms.
        data_tests: [not_null]
      - name: n_reference_rows
        description: Reference impressions in the bucket.
